<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pavith — UI/UX & Creative Designer</title>
  <meta name="description" content="Pavith is a UI/UX and creative designer crafting clear, thoughtful digital experiences." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --text: #141414;
      --muted: #5f5f66;
      --accent: #5b4bff;
      --accent-hover: #4535e6;
      --border: #e4e2dc;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f0f12;
        --surface: #17171c;
        --text: #f2f2f4;
        --muted: #a1a1aa;
        --accent: #8b7fff;
        --accent-hover: #a198ff;
        --border: #2a2a32;
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Navigation */
    .nav {
      position: fixed;
      inset: 0 0 auto 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem clamp(1rem, 5vw, 4rem);
      z-index: 10;
    }

    .logo {
      font-family: "Space Grotesk", sans-serif;
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--text);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .logo span { color: var(--accent); }

    .nav-link {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.2s;
    }

    .nav-link:hover { color: var(--text); }

    /* Hero */
    .hero {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      align-items: center;
      padding: 7rem clamp(1rem, 5vw, 4rem) 4rem;
      overflow: hidden;
    }

    /* Soft decorative glow */
    .hero::before {
      content: "";
      position: absolute;
      width: 38rem;
      height: 38rem;
      right: -10rem;
      top: 50%;
      transform: translateY(-50%);
      background: radial-gradient(circle, color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 65%);
      pointer-events: none;
    }

    .hero-content {
      position: relative;
      max-width: 52rem;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 500;
      margin-bottom: 2rem;
    }

    .badge::before {
      content: "";
      width: 0.5rem;
      height: 0.5rem;
      border-radius: 50%;
      background: #22c55e;
    }

    .hero-name {
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(3.5rem, 12vw, 8rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .hero-title {
      margin-top: 1rem;
      font-family: "Space Grotesk", sans-serif;
      font-size: clamp(1.4rem, 4vw, 2.25rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--accent);
    }

    .hero-intro {
      margin-top: 1.5rem;
      max-width: 34rem;
      font-size: clamp(1rem, 2vw, 1.15rem);
      color: var(--muted);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 2.5rem;
      padding: 1rem 1.75rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: background 0.2s, transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 8px 24px -8px color-mix(in srgb, var(--accent) 60%, transparent);
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn:focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 40%, transparent);
      outline-offset: 3px;
    }

    .btn .arrow { transition: transform 0.2s; }
    .btn:hover .arrow { transform: translateX(4px); }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>

  <header class="nav">
    <a href="#" class="logo">Pavith<span>.</span></a>
    <a href="#contact" class="nav-link">Contact</a>
  </header>

  <main>
    <section class="hero">
      <div class="hero-content">
        <p class="badge">Available for new projects</p>
        <h1 class="hero-name">Pavith</h1>
        <h2 class="hero-title">UI/UX &amp; Creative Designer</h2>
        <p class="hero-intro">
          I design clean, intuitive digital experiences that blend thoughtful usability with bold visual storytelling.
        </p>
        <a href="mailto:hello@example.com" class="btn" id="contact">
          Contact me <span class="arrow" aria-hidden="true">→</span>
        </a>
      </div>
    </section>
  </main>

</body>
</html>
